<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Inventario</title>
    <link rel="stylesheet" href="Style.css">
    <style>
        /* Estilos de lo nuevo: mensajes y botones de la tabla */
        #mensaje { margin-top: 12px; font-weight: bold; min-height: 20px; }
        .mensaje-ok { color: #1e8449; }
        .mensaje-error { color: #c00000; }
        td button { width: auto; padding: 6px 12px; margin-right: 6px; border: none; border-radius: 4px; color: #fff; cursor: pointer; }
        .btn-editar { background: #2980b9; }
        .btn-eliminar { background: #c0392b; }
        #btnCancelar { display: none; background: #7f8c8d; margin-top: 8px; }
    </style>
</head>
<body>
    <header><h1>Control de Inventario</h1></header>
    <div class="contenedor">
        <nav>
            <ul>
                <li><a href="inventario.html">Inventario</a></li>
                <li><a href="#" id="btnCerrar">Cerrar Sesión</a></li>
            </ul>
        </nav>
        <main>
            <h2>Productos en bodega</h2>
            <table>
                <thead><tr><th>Producto</th><th>Precio</th><th>Cantidad</th><th>Acciones</th></tr></thead>
                <tbody id="tablaInventario"></tbody>
            </table>
            <div class="caja-form">
                <h3>Agregar producto</h3>
                <!-- novalidate: dejo que las validaciones las haga el servidor y se vean sus mensajes -->
                <form id="formInventario" novalidate>
                    <input type="hidden" id="idProducto">
                    <input type="text" id="nombreProducto" placeholder="Nombre">
                    <input type="number" id="precioProducto" placeholder="Precio" step="0.01">
                    <input type="number" id="cantidadProducto" placeholder="Cantidad" step="1">
                    <button type="submit" id="btnGuardar">Guardar</button>
                    <button type="button" id="btnCancelar">Cancelar</button>
                </form>
                <p id="mensaje"></p>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
